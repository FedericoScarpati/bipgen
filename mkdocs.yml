site_name: bipgen
site_description: Spatial bipartite proximity graphs from degree-matched null models
repo_url: https://github.com/FedericoScarpati/bipgen
repo_name: bipgen
edit_uri: ""

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-4, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-7, name: Light mode}

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - User guide:
      - Specification format: specification.md
      - The model: model.md
      - Observed graphs: observed.md
      - Saving and exporting: io.md
      - Presets: presets.md
  - Tutorials:
      - Getting started: tutorials/01_getting_started.ipynb
      - Presets and comparison: tutorials/02_presets_and_comparison.ipynb
  - API reference: api.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocs-jupyter:
      execute: true
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
