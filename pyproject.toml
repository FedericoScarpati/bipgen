[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bipgen"  # working name: the package name lives here and in src/bipgen/
dynamic = ["version"]
description = "Spatial bipartite proximity graphs from degree-matched null models"
readme = "README.md"
requires-python = ">=3.10"
# license: to be decided (see project notes) before the first public release
authors = [{ name = "Federico Scarpati" }]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]
docs = ["mkdocs-material", "mkdocstrings[python]", "mkdocs-jupyter"]

[tool.setuptools.dynamic]
version = { attr = "bipgen.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
